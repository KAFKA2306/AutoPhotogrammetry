[project]
name = "autophotogrammetry"
version = "0.1.0"
description = "Video-to-Gaussian-Splat photogrammetry pipeline"
requires-python = ">=3.10,<3.13"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "numpy>=1.24,<3",
  "Pillow>=10,<12",
  "requests>=2.31,<3",
  "scikit-image>=0.22,<1",
]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["input", "output", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.basedpyright]
include = ["main.py", "processing", "tests"]
exclude = ["input", "output", ".venv"]
typeCheckingMode = "standard"
