name: VGGT Image

on:
  pull_request:
    paths:
      - Dockerfile.vggt
      - pyproject.toml
      - uv.lock
      - processing/vggt_backend.py
      - processing/backend_evaluation.py
      - processing/provenance.py
      - task
      - .github/workflows/vggt-image.yml
  push:
    branches: [main]
    paths:
      - Dockerfile.vggt
      - pyproject.toml
      - uv.lock
      - processing/vggt_backend.py
      - processing/backend_evaluation.py
      - processing/provenance.py
      - task
      - .github/workflows/vggt-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.vggt
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ghcr.io/kafka2306/autophotogrammetry:vggt-a288dd0-sm120-v1
            ghcr.io/kafka2306/autophotogrammetry:vggt-sha-${{ github.sha }}
          build-args: |
            VGGT_REVISION=a288dd0f14786c93483e45524328726ab7b1b4ce
            LIGHTGLUE_REVISION=746fac2c042e05d1865315b1413419f1c1e7ba55
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify research image contract
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm ghcr.io/kafka2306/autophotogrammetry:vggt-a288dd0-sm120-v1 \
            python -c 'import subprocess,torch,vggt,pycolmap; from lightglue import ALIKED,SuperPoint; rev=subprocess.run(["git","-C","/opt/vggt","rev-parse","HEAD"],check=True,capture_output=True,text=True).stdout.strip(); assert rev=="a288dd0f14786c93483e45524328726ab7b1b4ce"; assert torch.__version__.startswith("2.7.1"); print({"revision":rev,"torch":torch.__version__,"cuda":torch.version.cuda,"pycolmap":pycolmap.__version__})'
