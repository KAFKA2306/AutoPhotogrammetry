name: Historical PLY orientation

on:
  push:
    branches: ["verify/historical-ply-orientation"]
    paths:
      - "scripts/measure_historical_ply_orientation.py"
      - ".github/workflows/historical-ply-orientation.yml"
  pull_request:
    branches: ["verify/historical-ply-base"]
    paths:
      - "scripts/measure_historical_ply_orientation.py"
      - ".github/workflows/historical-ply-orientation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prove historical PLY set exists
        run: |
          find output -name splat.ply -type f -print
          test "$(find output -name splat.ply -type f | wc -l)" -eq 9
      - name: Install numeric dependency
        run: python -m pip install "numpy>=2.0,<3"
      - name: Measure real PLY orientation
        run: python scripts/measure_historical_ply_orientation.py --output orientation-results.json
      - name: Print machine-readable evidence
        run: cat orientation-results.json
      - name: Upload evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: historical-ply-orientation
          path: orientation-results.json
          if-no-files-found: error
