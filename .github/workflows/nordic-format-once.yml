name: Nordic Format Once

on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff format processing/nordic_discovery.py tests/test_nordic_discovery.py
      - uses: actions/upload-artifact@v4
        with:
          name: nordic-ruff-formatted
          path: |
            processing/nordic_discovery.py
            tests/test_nordic_discovery.py
          if-no-files-found: error
