name: Nordic Format Once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'feat/nordic-pool-stagea-automation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/nordic-pool-stagea-automation
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff format processing/nordic_pool.py processing/nordic_preflight.py tests/test_nordic_pool.py
      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add processing/nordic_pool.py processing/nordic_preflight.py tests/test_nordic_pool.py
          git commit -m "Format Nordic discovery code"
          git push origin HEAD:feat/nordic-pool-stagea-automation
