name: Shot Format Once

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'feat/shot-level-gs-preflight'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/shot-level-gs-preflight
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: >-
          uv run ruff format
          processing/shot_batch.py
          processing/shot_preflight.py
          processing/stage_d_sync.py
          processing/video_preflight.py
      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add processing/shot_batch.py processing/shot_preflight.py processing/stage_d_sync.py processing/video_preflight.py
          git commit -m "Format shot-level evaluation code"
          git push origin HEAD:feat/shot-level-gs-preflight
