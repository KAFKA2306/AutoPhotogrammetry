name: Shot Completion Patch

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'feat/shot-level-gs-preflight'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/shot-level-gs-preflight
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Patch shot cache, canonical COLMAP handoff, CLI, and task routes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          shot = Path("processing/shot_batch.py")
          text = shot.read_text(encoding="utf-8")
          text = text.replace("from __future__ import annotations\n\nimport json", "from __future__ import annotations\n\nimport argparse\nimport json")
          old_cache = '''    if not fresh:\n        cached = _successful_manifest(manifest_path)\n        if cached:\n            return cached\n'''
          new_cache = '''    if not fresh:\n        cached = _successful_manifest(manifest_path)\n        cached_preflight = cached.get("preflight") if isinstance(cached, Mapping) else None\n        if (\n            cached\n            and cached.get("schema_version") == 3\n            and isinstance(cached_preflight, Mapping)\n            and cached_preflight.get("selected_shot_id")\n        ):\n            return cached\n'''
          if old_cache not in text:
              raise SystemExit("shot cache block not found")
          text = text.replace(old_cache, new_cache)
          old_colmap = '''        manifest["colmap"] = colmap\n        apply_colmap_to_registry(registry_path, dataset, colmap)\n        sparse_model = Path(str(colmap["largest_model_path"]))\n\n        phase = "nerfstudio-process-data"\n'''
          new_colmap = '''        sparse_model = Path(str(colmap["largest_model_path"]))\n        canonical_model = sparse_root / "canonical"\n        if canonical_model.exists():\n            shutil.rmtree(canonical_model)\n        shutil.copytree(sparse_model, canonical_model)\n        colmap["canonical_model_path"] = str(canonical_model)\n        manifest["colmap"] = colmap\n        apply_colmap_to_registry(registry_path, dataset, colmap)\n\n        phase = "nerfstudio-process-data"\n'''
          if old_colmap not in text:
              raise SystemExit("COLMAP handoff block not found")
          text = text.replace(old_colmap, new_colmap)
          text = text.replace('str(sparse_model.resolve()),\n            ),', 'str(canonical_model.resolve()),\n            ),', 1)
          if "def main() -> None:" not in text:
              text += '''\n\n\ndef main() -> None:\n    parser = argparse.ArgumentParser(\n        description="Run one or more registry videos from measured continuous shots."\n    )\n    parser.add_argument("--registry", default="sources/videos.json")\n    parser.add_argument("--input-root", default="input")\n    parser.add_argument("--output-root", default="output")\n    parser.add_argument("--id", action="append", dest="ids")\n    parser.add_argument("--train-iterations", type=int, default=2000)\n    parser.add_argument("--timeout", type=float)\n    parser.add_argument("--fresh", action="store_true")\n    args = parser.parse_args()\n    registry = load_video_registry(args.registry)\n    ids = args.ids or [str(registry["default"])]\n    result = run_all_shot_videos(\n        registry_path=args.registry,\n        input_root=args.input_root,\n        output_root=args.output_root,\n        ids=ids,\n        train_iterations=args.train_iterations,\n        timeout=args.timeout,\n        fresh=args.fresh,\n    )\n    print(json.dumps(result, ensure_ascii=False, indent=2))\n    if result["status"] != "success":\n        raise SystemExit(1)\n\n\nif __name__ == "__main__":\n    main()\n'''
          shot.write_text(text, encoding="utf-8")

          task = Path("task")
          text = task.read_text(encoding="utf-8")
          old_mount = '''    -v "$ROOT/input:/workspace/input" \\\n    -v "$ROOT/output:/workspace/output" \\\n    -w /opt/autophotogrammetry \\\n'''
          new_mount = '''    -v "$ROOT/input:/workspace/input" \\\n    -v "$ROOT/output:/workspace/output" \\\n    -v "$ROOT/sources:/workspace/sources" \\\n    -w /opt/autophotogrammetry \\\n'''
          if old_mount not in text:
              raise SystemExit("run_gpu mount block not found")
          text = text.replace(old_mount, new_mount, 1)
          old_run = '''  run)\n    doctor\n    run_gpu python main.py huejotzingo --input-root /workspace/input --output-root /workspace/output\n    ;;\n  run-all)\n    doctor\n    run_gpu python -m processing.production_batch \\\n      --input-root /workspace/input \\\n      --output-root /workspace/output\n    ;;\n'''
          new_run = '''  run)\n    doctor\n    run_gpu python -m processing.shot_batch \\\n      --registry /workspace/sources/videos.json \\\n      --input-root /workspace/input \\\n      --output-root /workspace/output\n    ;;\n  run-one)\n    scene="${2:-}"\n    if [[ -z "$scene" ]]; then\n      echo "usage: ./task run-one <scene-id>" >&2\n      exit 2\n    fi\n    doctor\n    run_gpu python -m processing.shot_batch \\\n      --registry /workspace/sources/videos.json \\\n      --input-root /workspace/input \\\n      --output-root /workspace/output \\\n      --id "$scene"\n    ;;\n  run-all)\n    doctor\n    run_gpu python -m processing.production_batch \\\n      --registry /workspace/sources/videos.json \\\n      --input-root /workspace/input \\\n      --output-root /workspace/output\n    ;;\n'''
          if old_run not in text:
              raise SystemExit("task run block not found")
          text = text.replace(old_run, new_run)
          old_quality = '''    prepare_named_runtime "$IMAGE"\n    run_quality_scene "$scene" "$iterations"\n    ;;\n'''
          new_quality = '''    prepare_named_runtime "$IMAGE"\n    run_quality_scene "$scene" "$iterations"\n    run_gpu python -m processing.stage_d_sync \\\n      --registry /workspace/sources/videos.json \\\n      --source-id "$scene" \\\n      --backend-result "/workspace/output/$scene/quality-sweep/default/backend-result.json"\n    ;;\n'''
          if old_quality not in text:
              raise SystemExit("task quality block not found")
          text = text.replace(old_quality, new_quality, 1)
          old_usage = 'usage: ./task {run|run-all|quality [scene] [iterations]|'
          if old_usage not in text:
              raise SystemExit("task usage block not found")
          text = text.replace(old_usage, 'usage: ./task {run|run-one <scene-id>|run-all|quality [scene] [iterations]|', 1)
          task.write_text(text, encoding="utf-8")

          colmap = Path("processing/colmap_evaluation.py")
          text = colmap.read_text(encoding="utf-8")
          for label in ("Cameras", "Images", "Registered images", "Points", "Observations", "Mean track length", "Mean observations per image", "Mean reprojection error"):
              text = text.replace(f'r"{label}:', f'r"(?m)^{label}:')
          colmap.write_text(text, encoding="utf-8")
          PY
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff format processing/shot_batch.py processing/colmap_evaluation.py
      - run: bash -n task
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add processing/shot_batch.py processing/colmap_evaluation.py task
          git commit -m "Complete shot pipeline execution routes"
          git push origin HEAD:feat/shot-level-gs-preflight
