name: Post-tooling bootstrap

on:
  push:
    branches: [fix/post-tooling-gates]

concurrency:
  group: post-tooling-bootstrap
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  normalize-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/post-tooling-gates
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Apply deterministic Ruff normalization
        run: |
          uv run ruff format .
          uv run ruff check --fix .
      - name: Verify full repository gate
        run: bash scripts/check
      - name: Commit mechanical normalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Tooling: normalize latest main under Ruff gates"
          git fetch origin fix/post-tooling-gates
          git rebase origin/fix/post-tooling-gates
          git push origin HEAD:fix/post-tooling-gates
