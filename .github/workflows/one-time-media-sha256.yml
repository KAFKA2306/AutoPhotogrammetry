name: One-time media SHA-256

on:
  push:
    branches:
      - feat/media-sha256-avenida

permissions:
  contents: write

jobs:
  hash-media:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Freeze exact processing media SHA-256
        run: python -m processing.media_hash --source-id avenida-gomez-morin --timeout-seconds 300
      - name: Commit measured registry evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources/videos.json
          git diff --cached --exit-code && exit 1 || true
          git commit -m "Video: freeze Avenida processing media SHA-256"
          git push
