name: Shot Typefix Once

on:
  pull_request:

permissions:
  contents: write

jobs:
  typefix:
    if: github.event.pull_request.head.ref == 'feat/shot-level-gs-preflight'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/shot-level-gs-preflight
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply Pyrefly-safe narrowing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("processing/shot_preflight.py")
          text = path.read_text(encoding="utf-8")
          old = '''        if detector.descriptors is None or detector.keypoints is None:\n            return np.empty((0, 2)), np.empty((0, 2)), 0, 0, 0\n        keypoints.append(detector.keypoints)\n        descriptors.append(detector.descriptors)\n'''
          new = '''        raw_descriptors = getattr(detector, "descriptors", None)\n        raw_keypoints = getattr(detector, "keypoints", None)\n        if raw_descriptors is None or raw_keypoints is None:\n            return np.empty((0, 2)), np.empty((0, 2)), 0, 0, 0\n        keypoints.append(np.asarray(raw_keypoints))\n        descriptors.append(np.asarray(raw_descriptors))\n'''
          if old not in text:
              raise SystemExit("ORB block not found")
          text = text.replace(old, new)
          text = text.replace(
              '''        params = np.asarray(model.params, dtype=np.float64)\n        residuals = _sampson_residuals(params, first, second)\n''',
              '''        raw_params = getattr(model, "params", None)\n        if raw_params is None:\n            continue\n        params = np.asarray(raw_params, dtype=np.float64)\n        residuals = _sampson_residuals(params, first, second)\n''',
          )
          text = text.replace(
              '''        if refined.estimate(first[best_inliers], second[best_inliers]):\n            best_model = np.asarray(refined.params, dtype=np.float64)\n            best_inliers = _sampson_residuals(best_model, first, second) <= threshold\n''',
              '''        if refined.estimate(first[best_inliers], second[best_inliers]):\n            raw_params = getattr(refined, "params", None)\n            if raw_params is not None:\n                best_model = np.asarray(raw_params, dtype=np.float64)\n                best_inliers = _sampson_residuals(best_model, first, second) <= threshold\n''',
          )
          text = text.replace(
              '''        residuals = _projective_transfer_error(np.asarray(model.params), first, second)\n''',
              '''        raw_params = getattr(model, "params", None)\n        if raw_params is None:\n            continue\n        residuals = _projective_transfer_error(np.asarray(raw_params), first, second)\n''',
          )
          path.write_text(text, encoding="utf-8")

          path = Path("processing/video_preflight.py")
          text = path.read_text(encoding="utf-8")
          old = '''    duration_raw = (probe.get("format") or {}).get("duration")\n    try:\n        duration_seconds = float(duration_raw)\n    except (TypeError, ValueError) as exc:\n        raise ValueError("video probe did not provide a finite duration") from exc\n'''
          new = '''    duration_raw = (probe.get("format") or {}).get("duration")\n    if not isinstance(duration_raw, (str, int, float)):\n        raise ValueError("video probe did not provide a finite duration")\n    try:\n        duration_seconds = float(duration_raw)\n    except ValueError as exc:\n        raise ValueError("video probe did not provide a finite duration") from exc\n'''
          if old not in text:
              raise SystemExit("duration block not found")
          text = text.replace(old, new)
          text = text.replace('''            shot = dict(interval)\n''', '''            shot: dict[str, Any] = dict(interval)\n''')
          path.write_text(text, encoding="utf-8")
          PY
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff format processing/shot_preflight.py processing/video_preflight.py
      - run: uv run pyrefly check
      - name: Commit typing fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add processing/shot_preflight.py processing/video_preflight.py
          git commit -m "Fix shot-level static typing"
          git push origin HEAD:feat/shot-level-gs-preflight
