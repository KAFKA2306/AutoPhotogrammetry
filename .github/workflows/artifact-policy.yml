name: Artifact policy

on:
  push:
  pull_request:

jobs:
  reject-tracked-ply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject generated PLY files tracked by Git
        shell: bash
        run: |
          set -euo pipefail
          tracked="$(git ls-files '*.ply')"
          if [[ -n "$tracked" ]]; then
            echo 'Generated PLY artifacts must not be committed to Git.' >&2
            echo "$tracked" >&2
            exit 1
          fi
