name: Design conformance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify canonical design contract
        run: node assets/.kafka-design/portable-conformance.mjs --consumer "$GITHUB_WORKSPACE"
