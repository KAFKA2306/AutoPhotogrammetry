name: Tooling Bootstrap

on:
  push:
    branches: [feat/fast-quality-gates]

concurrency:
  group: tooling-bootstrap-fast-quality-gates
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/fast-quality-gates
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Resolve locked environment
        run: |
          uv lock
          uv sync --locked
          uv export --frozen --no-dev --format requirements-txt --output-file requirements.txt
      - name: Apply mechanical Ruff migration
        run: |
          uv run ruff format .
          uv run ruff check . --fix
      - name: Freeze existing Pyrefly debt
        run: |
          uv run pyrefly check --baseline=.pyrefly-baseline.json --update-baseline || test -s .pyrefly-baseline.json
          uv run pyrefly check
      - name: Commit generated lock baseline and formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Tooling: freeze uv lock Pyrefly baseline and Ruff format"
          git fetch origin feat/fast-quality-gates
          git rebase origin/feat/fast-quality-gates
          git push origin HEAD:feat/fast-quality-gates
