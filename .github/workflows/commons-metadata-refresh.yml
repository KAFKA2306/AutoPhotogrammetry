name: Commons Metadata Refresh

on:
  push:
    branches: [feat/commons-metadata-refresh]

concurrency:
  group: commons-metadata-refresh
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/commons-metadata-refresh
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Refresh metadata from Commons API
        run: |
          python -m processing.commons_metadata \
            --registry sources/videos.json \
            --request-delay-seconds 1.0 \
            | tee sources/metadata-refresh-summary.json
      - name: Verify registry contract
        run: python -m unittest tests.test_commons_metadata tests.test_video_sources -v
      - name: Commit verified metadata evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources/videos.json sources/metadata-refresh-summary.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Video: verify Commons Stage-A metadata for registry"
          git fetch origin feat/commons-metadata-refresh
          git rebase origin/feat/commons-metadata-refresh
          git push origin HEAD:feat/commons-metadata-refresh
